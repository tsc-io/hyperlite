#
# Configuration file for the "--config <path>" form of Context.Create.
#
# It used to configure the Thrift provider, which is why the test reading it was skipped
# on every build - Thrift has not been part of this product for a long time. It now
# configures SQLite, so the test runs and "--config" is covered again.
#
# Three kinds of option on purpose, because each takes a different path through
# PropertyResolver: one that decides the provider, one whose type the registry knows,
# and three it has never heard of.
#

# the provider, under the canonical prefix
Hyperlite.Provider=SQLite
Hyperlite.SQLite.Filename=config-test.db

# a registered option, so the value has to arrive typed rather than as text
Hyperlite.SQLite.PageSizeKB=8

# options the client does not know: carried through untyped, which is what
# allow_unregistered_options(true) did in ht4c
X.Y.String=Unknown
X.Y.Bool=Yes
X.Y.Int=32
