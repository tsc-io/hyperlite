# Publishes a release when a tag v<package version> is pushed, e.g. v2026.10.0: builds, tests
# and packs through build.yml, pushes the packages to nuget.org and creates the GitHub release
# with the packages, the explorer zip and the native symbols attached.
#
# Needs, once:
#   - an environment named nuget in the repository settings, with required reviewers and a
#     deployment rule allowing tags v* only, so that nothing is published without someone
#     approving it. Create it before the first tag: one a workflow names that does not exist is
#     created on the spot, unprotected
#   - private vulnerability reporting, under Settings, Code security - right after the first
#     push, not only before the first tag: SECURITY.md sends reporters to the Report a
#     vulnerability button, which exists only with it on
#   - a repository variable NUGET_USER, the nuget.org account the packages belong to
#   - a trusted publishing policy on nuget.org for this repository and release.yml - no API key
#     is stored anywhere, NuGet/login exchanges the run's OIDC token for one that lasts an hour

name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget

    permissions:
      contents: write # the GitHub release
      id-token: write # nuget.org trusted publishing

    steps:
      # a release is made from main only: a tag pushed on a branch publishes nothing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # the tag names the version; a tag that does not match what was packed publishes nothing
      - name: Check the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for id in Hyperlite Hyperlite.Persistence Hyperlite.Serialization; do
            test -f "artifacts/packages/$id.$version.nupkg" || { echo "::error::$id.$version.nupkg was not packed - the tag does not match Version.props"; exit 1; }
          done
          test -f "artifacts/explorer/Hyperlite.Explorer.$version.zip" || { echo "::error::Hyperlite.Explorer.$version.zip was not packed"; exit 1; }

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate, so that a run repeated after a partial failure completes
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." \
            artifacts/packages/*.nupkg artifacts/explorer/*.zip artifacts/native-symbols/*.pdb
