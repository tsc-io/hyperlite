# Proposes updates for the pinned actions and the centrally managed packages, once a week.
#
# Held back, because net7.0 is the leg that runs the netstandard2.0 assemblies - see
# Directory.Packages.props: Microsoft.NET.Test.Sdk 17.14 refuses net7.0 at build time, MSTest 4
# and System.Configuration.ConfigurationManager 9 support net8.0 and later only.
# System.Drawing.Common, the explorer's, stays on the line of the oldest .NET it targets.
#
# Not seen here: Microsoft.Sbom.Targets, the SBOM generator, whose version is a property in
# Directory.Build.props feeding a PackageDownload - it is bumped by hand.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The C# projects by name, not the solution: from / Dependabot walks Hyperlite.sln, whose
  # C++ projects import the Visual C++ targets, which its Linux runner does not have - it then
  # fails before any update. The versions are central, in Directory.Packages.props.
  - package-ecosystem: nuget
    directories:
      - /src/Hyperlite
      - /src/Hyperlite.Persistence
      - /src/Hyperlite.Serialization
      - /src/Hyperlite.Explorer
      - /tests/Hyperlite.Test
      - /tests/Hyperlite.Persistence.Test
      - /tests/Hyperlite.Serialization.Test
      - /tests/Hyperlite.Smoke
      - /bench/Hyperlite.Bench
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Microsoft.NET.Test.Sdk
        versions: [ ">= 17.14" ]
      - dependency-name: MSTest.TestAdapter
        versions: [ ">= 4.0" ]
      - dependency-name: MSTest.TestFramework
        versions: [ ">= 4.0" ]
      - dependency-name: System.Configuration.ConfigurationManager
        versions: [ ">= 9.0" ]
      - dependency-name: System.Drawing.Common
        versions: [ ">= 9.0" ]
